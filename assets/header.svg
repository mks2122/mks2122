<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Karthick Sriram — AI Product Engineer">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .name { fill: #f0f3f6; font-size: 54px; font-weight: 700; letter-spacing: -1px; }
    .role { fill: #9aa7b4; font-size: 21px; }
    .accent { fill: #f0a24b; }
    .dim { fill: #5b6673; font-size: 15px; }
    .step { fill: #8b98a5; font-size: 15px; }
    .node { fill: #161b22; stroke: #2b3440; stroke-width: 1.2; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: travel 9s linear infinite; }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(1040px); } }
    .dot { fill: #f0a24b; opacity: .2; animation: on 9s linear infinite; }
    @keyframes on { 0% { opacity: 1; } 10% { opacity: .2; } 100% { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .pulse, .dot { animation: none; } }
  </style>

  <rect width="1200" height="340" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="14" fill="none" stroke="#21262d"/>

  <!-- faint grid -->
  <g stroke="#161b22" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M100 0V340M200 0V340M300 0V340M400 0V340M500 0V340M600 0V340M700 0V340M800 0V340M900 0V340M1000 0V340M1100 0V340"/>
  </g>

  <!-- window chrome -->
  <circle cx="30" cy="28" r="6" fill="#30363d"/>
  <circle cx="50" cy="28" r="6" fill="#30363d"/>
  <circle cx="70" cy="28" r="6" fill="#30363d"/>
  <text x="1170" y="33" text-anchor="end" class="mono dim">~/chennai · IN</text>

  <text x="80" y="104" class="mono dim">$ whoami</text>
  <text x="80" y="164" class="sans name">Karthick Sriram</text>
  <text x="80" y="202" class="mono role"><tspan class="accent">AI Product Engineer</tspan> · agents, agentic systems &amp; the product around them<tspan class="accent cursor"> ▍</tspan></text>

  <!-- pipeline: idea → iteration -->
  <line x1="80" y1="268" x2="1120" y2="268" stroke="#2b3440" stroke-width="1.5" stroke-dasharray="3 5"/>
  <g class="pulse">
    <circle cx="80" cy="268" r="4" fill="#f0a24b"/>
    <circle cx="80" cy="268" r="10" fill="#f0a24b" opacity=".18"/>
  </g>
  <g class="mono step" text-anchor="middle">
    <circle class="dot" style="animation-delay:0s" cx="80"   cy="268" r="4"/><text x="80"   y="300">idea</text>
    <circle class="dot" style="animation-delay:1s" cx="210"  cy="268" r="4"/><text x="210"  y="300">UI</text>
    <circle class="dot" style="animation-delay:2s" cx="340"  cy="268" r="4"/><text x="340"  y="300">backend</text>
    <circle class="dot" style="animation-delay:3s" cx="470"  cy="268" r="4"/><text x="470"  y="300">AI</text>
    <circle class="dot" style="animation-delay:4s" cx="600"  cy="268" r="4"/><text x="600"  y="300">infra</text>
    <circle class="dot" style="animation-delay:5s" cx="730"  cy="268" r="4"/><text x="730"  y="300">deploy</text>
    <circle class="dot" style="animation-delay:6s" cx="860"  cy="268" r="4"/><text x="860"  y="300">security</text>
    <circle class="dot" style="animation-delay:7s" cx="990"  cy="268" r="4"/><text x="990"  y="300">feedback</text>
    <circle class="dot" style="animation-delay:8s" cx="1120" cy="268" r="4"/><text x="1120" y="300">iterate</text>
  </g>
</svg>
